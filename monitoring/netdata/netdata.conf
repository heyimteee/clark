[global]
  # Tailscale-free hostname for a stable identity across reboots.
  hostname = 3studio-server

[db]
  # 60-day retention: tier0 (per-second) keeps 60 days; tier1 (per-minute)
  # keeps longer. Disk quota of 16 GiB bounds growth (~148 GiB free).
  mode = dbengine
  dbengine multihost disk space MB = 16384
  storage tiers = 3
  update every = 1

[web]
  # Only bind to localhost + tailnet so the dashboard is not exposed publicly.
  bind to = 127.0.0.1 *:19999
  # Defense in depth (#62): the host-network bind still listens on every
  # interface, so also refuse connections that are not loopback or the
  # tailnet (CGNAT 100.64.0.0/10). Netdata holds a direct docker.sock and
  # SYS_ADMIN, so its UI must never be reachable by third parties.
  allow connections from = 127.* ::1 localhost 100.*
