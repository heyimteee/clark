services:
  clark:
    build: .
    image: clark:latest
    container_name: clark
    restart: unless-stopped
    environment:
      # Ollama: use your .env value, or default to the Docker host.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL in your .env}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # First-boot master context (overridable later via WhatsApp self-chat).
      - CLARK_CONTEXT=${CLARK_CONTEXT:-Available}
      # Persona — everything below is optional and only configures the prompt.
      - MASTER_NAME=${MASTER_NAME:-the Master}
      - PROTOCOL_NAME=${PROTOCOL_NAME:-Butler}
      - PALACE_NAME=${PALACE_NAME:-Palace}
      - BYPASS_PHRASE=${BYPASS_PHRASE:-get him to me}
      - INNER_CIRCLE=${INNER_CIRCLE:-}
      # iMessage bridge transport. The bridge API listens on its own address
      # (:8091), separate from the public web console — it is never reachable
      # through https://clark.<domain>/. The macOS bridge daemon connects over
      # Tailscale, e.g. IMESSAGE_BRIDGE_URL=http://<server-tailnet-ip>:8091.
      # To expose 8091 to the tailnet only, uncomment the ports block below
      # AND firewall host port 8091 to your tailnet subnet.
      - IMESSAGE_ENABLED=${IMESSAGE_ENABLED:-0}
      - IMESSAGE_LISTEN_ADDR=:8091
      - IMESSAGE_BRIDGE_TOKEN=${IMESSAGE_BRIDGE_TOKEN:?set IMESSAGE_BRIDGE_TOKEN in your .env}
      - IMESSAGE_SELF_HANDLE=${IMESSAGE_SELF_HANDLE:-}
      # Web console (bento dashboard + chat). WEB_TOKEN is mandatory when
      # enabled: the server refuses to start without it (port 443 is public).
      - WEB_ENABLED=${WEB_ENABLED:-1}
      - WEB_TOKEN=${WEB_TOKEN:-}
      - CLARK_START_STATUS=${CLARK_START_STATUS:-}
      - ALERT_TOKEN=${ALERT_TOKEN:-}
      - ALERT_MODE=${ALERT_MODE:-voice}
      - MAC_ACTION_URL=${MAC_ACTION_URL:-}
      - MAC_ACTION_TOKEN=${MAC_ACTION_TOKEN:-}
      # Speech seam. STT runs faster-whisper (baked into the image); STT_ENGINE=ollama
      # uses the Ollama whisper model instead. TTS runs Kokoro on the Master's
      # Mac (TTS_REMOTE_URL, near-instant on Apple Silicon) with the server-side
      # Piper daemon as fallback; set TTS_ENGINE=piper for server-only.
      - STT_ENGINE=${STT_ENGINE:-faster-whisper}
      - STT_MODEL=${STT_MODEL:-whisper-turbo}
      - TTS_ENGINE=${TTS_ENGINE:-kokoro-remote}
      - TTS_VOICE=${TTS_VOICE:-en_US-ryan-high}
      - KOKORO_VOICE=${KOKORO_VOICE:-am_michael}
      - TTS_REMOTE_URL=${TTS_REMOTE_URL:-}
      - TTS_REMOTE_TOKEN=${TTS_REMOTE_TOKEN:-}
      # Headless container: no desktop notifications.
      - CLARK_NO_NOTIFY=1
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      # Persists the SQLite database (WhatsApp session + settings + history).
      - ./data:/data
      # Affirmations (wake + "Processing, Sir."). Michael clips synced from the
      # Mac via scripts/sync-affirmations.sh live here and take priority; the
      # image bakes piper fallback clips that seed this dir on first boot.
      - ./affirmations:/opt/affirmations
    # Explicit upstream DNS for clark's outbound lookups (web_search). Docker's
    # embedded resolver cannot forward through Tailscale MagicDNS on its own;
    # these bypass the broken 127.0.0.11 path. Tailscale MagicDNS first (keeps
    # tailnet hostnames), Cloudflare as a public fallback.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    networks:
      - clark
      - npm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"

# clark's private network (inbound from NPM only).
networks:
  clark:
    driver: bridge
  # The Nginx Proxy Manager network. If yours uses a different name (e.g. a
  # project-prefixed `npm_default`), set NPM_NETWORK accordingly.
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
