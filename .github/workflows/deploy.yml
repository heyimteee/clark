name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Human approval gate (#62): pushing to main no longer deploys by itself.
    # The "production" environment requires a required reviewer to approve
    # the run before the self-hosted steps execute on the server.
    environment: production
    steps:
      - name: Pull latest code
        run: git -C /home/tristan/clark pull --ff-only

      - name: Rebuild and restart
        run: |
          cd /home/tristan/clark
          for i in 1 2 3; do docker compose up -d --build && break || { echo "retry $i/3 failed, waiting..."; sleep 10; }; done
          docker ps --filter name=clark --format '{{.Names}}\t{{.Status}}' | grep -q clark || { echo "container clark not running after build"; docker ps -a --filter name=clark; exit 1; }

      - name: Verify container
        run: docker ps --filter name=clark --format '{{.Names}}\t{{.Status}}'
